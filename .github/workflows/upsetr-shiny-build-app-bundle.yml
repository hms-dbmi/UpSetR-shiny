# UpSetR-shiny app-layer bundle builder for the ShinyApps store (Route A).
# Place at  fentouxungui/UpSetR-shiny/.github/workflows/upsetr-shiny-build-app-bundle.yml
#           on the DEFAULT branch = master.  No shell rebuild is required.
#
# Produces, per platform:  upsetr-shiny-<version>-<platform>.zip
#   bundle/  +- manifest.json
#            +- app/{app.R,ui.R,server.R,converters.R,www/**}
#            +- rlib/<Pkg>/   (prebuilt CRAN binaries, R 4.6.1)
#
# Contract check (same onboarding as iSEE / UCSCXenaShiny / spatialLIBD / beeRapp / CSBB-Shiny / bestDEG):
#   * UpSetR-shiny is a LEGACY two-file Shiny app (NOT an R package):
#       ui.R defines `shinyUI(navbarPage(...))`; server.R sets options, loads
#       ggplot2/gridExtra/plyr/UpSetR/shinythemes/RSVGTipsDevice, sources
#       converters.R, and defines `shinyServer(function(...))`.  There is no
#       global.R, no app.R, and no runApp() call.
#   * A directory that contains app.R IGNORES ui.R/server.R, so this workflow
#     GENERATES app/app.R, which reproduces exactly what shiny::runApp() does
#     for a ui.R/server.R directory: shiny::shinyAppDir(".") -- it returns a
#     shiny.appobj and does NOT call runApp() itself.  The entry also locates
#     its own directory from --file so www/ and the movies.csv download link
#     resolve whether it is launched as a directory app or as a script.
#   * No DESCRIPTION / no `R CMD build`: this is not a package.
#
# Dependency notes / gotchas:
#   * CRAN seed: shiny, ggplot2, gridExtra, plyr, UpSetR, shinythemes.
#   * RSVGTipsDevice is ARCHIVED on CRAN (last release 1.0-7, 2016) yet
#     server.R loads it unconditionally for the SVG download option.  It is
#     installed from the CRAN Archive tarball; if it fails to build on R 4.6.1
#     a minimal stub is installed that maps devSVGTips() onto grDevices::svg()
#     so the app still loads and SVG export works (without tooltips).
#   * No runtime network is required for plotting.
#   * base-priority packages are excluded from the closure; recommended ones
#     (Matrix, MASS, ...) are kept so the bundle is self-contained.

name: Build app bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach bundles to"
        required: false
        type: string
        default: "v0.1.0"

permissions:
  contents: write

env:
  APP_ID: upsetr-shiny
  APP_NAME: "UpSetR-shiny"
  APP_AUTHOR: "Jake R Conway, Nils Gehlenborg"
  APP_DESC: "Interactive UpSet plots of set intersections from file, list, or expression input (Shiny wrapper for the UpSetR R package)"
  APP_HOMEPAGE: "https://github.com/fentouxungui/UpSetR-shiny"
  APP_LICENSE: "Unspecified (upstream declares no license)"
  R_VERSION: "4.6.1"

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "win-x64" }
          - { os: macos-14,       platform: "mac-arm64" }
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install build helpers
        shell: bash
        run: Rscript -e 'install.packages(c("jsonlite","zip","digest","BiocManager"), repos="https://cloud.r-project.org")'

      - name: Resolve store version
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}${{ inputs.tag }}"
          V="${V#v}"
          if [ -z "$V" ]; then V="0.1.0"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Assemble bundle (app/ + rlib/ + manifest.json)
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle <- file.path(getwd(), "bundle")
          unlink(bundle, recursive = TRUE); dir.create(bundle, recursive = TRUE)
          appdir <- file.path(bundle, "app"); dir.create(appdir, recursive = TRUE)
          lib <- file.path(bundle, "rlib"); dir.create(lib, recursive = TRUE)

          # --- 1. copy the app sources verbatim ------------------------------
          src <- getwd()
          for (f in c("ui.R", "server.R", "converters.R", "www", "README.md")) {
            from <- file.path(src, f)
            if (file.exists(from)) file.copy(from, appdir, recursive = TRUE)
          }
          for (need in c("ui.R", "server.R", "converters.R")) {
            if (!file.exists(file.path(appdir, need))) stop(need, " missing after copy")
          }

          # --- 2. generate the bundle entry app/app.R ------------------------
          writeLines(c(
            '# UpSetR-shiny bundle entry (generated by upsetr-shiny-build-app-bundle.yml)',
            'options(shiny.launch.browser = FALSE, shiny.deprecation.messages = FALSE)',
            '# Resolve relative asset paths whether launched as a directory app',
            '# (runApp("app"); cwd is already the app dir) or as a script.',
            '.a <- commandArgs(trailingOnly = FALSE)',
            '.f <- sub("^--file=", "", .a[grepl("^--file=", .a)])',
            'if (length(.f) == 1L && nzchar(.f)) setwd(dirname(normalizePath(.f)))',
            '# Legacy two-file app: ui.R defines shinyUI(...), server.R defines',
            '# shinyServer(...) and sources converters.R. shinyAppDir reproduces',
            '# what runApp() does for a ui.R/server.R directory and returns a',
            '# shiny.appobj WITHOUT calling runApp().',
            'shiny::shinyAppDir(".")'
          ), file.path(appdir, "app.R"))

          # --- 3. install the dependency closure into bundle/rlib -----------
          repos <- BiocManager::repositories()
          options(repos = repos)

          seed <- c("shiny", "ggplot2", "gridExtra", "plyr", "UpSetR",
                    "shinythemes", "RSVGTipsDevice")

          db <- available.packages(repos = repos)
          cat("available packages:", nrow(db), "\n")
          closure <- setdiff(seed, "RSVGTipsDevice")
          closure <- unique(c(closure,
                     unlist(tools::package_dependencies(closure, db = db, recursive = TRUE))))
          base_pkgs <- rownames(installed.packages(priority = "base"))
          closure <- setdiff(closure, base_pkgs)
          closure <- closure[closure %in% rownames(db)]
          cat("closure packages to install:", length(closure), "\n")

          install_into <- function(pkgs, type) {
            if (!length(pkgs)) return(invisible())
            install.packages(pkgs, lib = lib, repos = repos, type = type,
                             dependencies = FALSE, Ncpus = 2)
          }
          lib_pkgs <- function() basename(list.dirs(lib, recursive = FALSE))

          install_into(closure, "binary")
          no_binary <- setdiff(closure, lib_pkgs())
          if (length(no_binary)) {
            cat("no binary available, installing from source:", length(no_binary), "\n")
            install_into(no_binary, "source")
          }

          # --- 3b. RSVGTipsDevice (archived on CRAN) + stub fallback ---------
          if (!dir.exists(file.path(lib, "RSVGTipsDevice"))) {
            try(install.packages(
              "https://cran.r-project.org/src/contrib/Archive/RSVGTipsDevice/RSVGTipsDevice_1.0-7.tar.gz",
              lib = lib, repos = NULL, type = "source", dependencies = TRUE))
          }
          if (!dir.exists(file.path(lib, "RSVGTipsDevice"))) {
            cat("RSVGTipsDevice build failed; installing SVG stub\n")
            sd <- file.path(tempdir(), "RSVGTipsDevice")
            dir.create(file.path(sd, "R"), recursive = TRUE, showWarnings = FALSE)
            writeLines(c(
              "Package: RSVGTipsDevice",
              "Version: 1.0-7",
              "Title: Stub for the Archived RSVGTipsDevice",
              "Description: Minimal fallback that maps devSVGTips() onto grDevices::svg().",
              "Author: ShinyApps bundle",
              "Maintainer: ShinyApps bundle <noreply@example.com>",
              "License: GPL-3",
              "Encoding: UTF-8"), file.path(sd, "DESCRIPTION"))
            writeLines("export(devSVGTips)", file.path(sd, "NAMESPACE"))
            writeLines(c(
              "devSVGTips <- function(file, width = 7, height = 7, ...) {",
              "  grDevices::svg(filename = file, width = width, height = height)",
              "}"), file.path(sd, "R", "stub.R"))
            system2(file.path(R.home("bin"), "R"),
                    c("CMD", "INSTALL", "-l", shQuote(lib), shQuote(sd)))
          }

          present <- lib_pkgs()
          required <- setdiff(seed, base_pkgs)
          missing <- setdiff(required, present)
          if (length(missing)) stop("packages missing from rlib: ", paste(missing, collapse = ", "))
          still_dep <- setdiff(closure, present)
          if (length(still_dep)) cat("WARNING: closure packages still missing:", paste(still_dep, collapse = ", "), "\n")
          cat("rlib packages:", length(present), "\n")

          # --- 4. write manifest.json ---------------------------------------
          pkgs <- as.data.frame(installed.packages(lib.loc = lib))
          src_of <- function(p) if (p == "RSVGTipsDevice") "local" else "cran"
          man <- list(
            schema = 1L,
            id = Sys.getenv("APP_ID"), name = Sys.getenv("APP_NAME"), version = Sys.getenv("VERSION"),
            author = Sys.getenv("APP_AUTHOR"), description = Sys.getenv("APP_DESC"),
            homepage = Sys.getenv("APP_HOMEPAGE"), license = Sys.getenv("APP_LICENSE"),
            runtime = "r-shiny", entry = "app/app.R",
            platform = "${{ matrix.platform }}",
            r_version = Sys.getenv("R_VERSION"), min_shell_version = "0.1.0",
            notes = "Legacy two-file Shiny app (ui.R shinyUI / server.R shinyServer, not an R package). Entry app/app.R is generated and returns shiny::shinyAppDir('.'). RSVGTipsDevice is installed from the CRAN Archive (last release 1.0-7, 2016); if it does not build, a stub maps devSVGTips() onto grDevices::svg().",
            packages = lapply(seq_len(nrow(pkgs)), function(i) list(
              name = pkgs$Package[i], version = pkgs$Version[i],
              path = file.path("rlib", pkgs$Package[i]), source = src_of(pkgs$Package[i])))
          )
          jsonlite::write_json(man, file.path(bundle, "manifest.json"), pretty = TRUE, auto_unbox = TRUE)

      - name: Zip + sha256
        shell: Rscript {0}
        run: |
          out <- sprintf("%s-%s-%s.zip", Sys.getenv("APP_ID"), Sys.getenv("VERSION"), "${{ matrix.platform }}")
          bundle <- file.path(getwd(), "bundle")
          old <- setwd(bundle); on.exit(setwd(old))
          zip::zipr(out, files = list.files(".", all.files = TRUE, no.. = TRUE))
          entries <- utils::unzip(out, list = TRUE)$Name
          if (!any(grepl("^rlib/", entries))) stop("zip is missing rlib/ -- aborting")
          if (!any(grepl("^app/app[.]R$", entries))) stop("zip is missing app/app.R -- aborting")
          if (!any(grepl("^app/ui[.]R$", entries))) stop("zip is missing app/ui.R -- aborting")
          if (!any(grepl("^app/server[.]R$", entries))) stop("zip is missing app/server.R -- aborting")
          setwd(old)
          file.rename(file.path(bundle, out), out)
          sha <- digest::digest(out, algo = "sha256", file = TRUE)
          sz <- file.size(out)
          cat("bundle zip size (bytes):", sz, "\n")
          if (sz > 2 * 1024^3) {
            warning("bundle exceeds the 2 GiB GitHub Release asset limit; ",
                    "trim heavy dependencies or split the app.")
          }
          writeLines(sprintf('{"platform":"%s","file":"%s","sha256":"%s","size":%d}',
                     "${{ matrix.platform }}", out, sha, sz),
                     sprintf("meta-%s.json", "${{ matrix.platform }}"))

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            *.zip
            meta-*.json

  release:
    needs: bundle
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
